services:
  api_gateway:
    restart: always
    build:
      context: .
      dockerfile: docker/dockerfile
      target: api_gateway
    ports:
      - "${API_GATEWAY_PORT}:8000"
    depends_on:
      - sql_db
      - rabbit_mq
    env_file:
      - .env

  mq_consumer:
    restart: always
    build:
      context: .
      dockerfile: docker/dockerfile
      target: mq_consumer
    ports:
      - "${MQ_CONSUMER_PORT}:8000"
    depends_on:
      - sql_db
      - rabbit_mq
      - redis
      - api_gateway
    env_file:
      - .env

  sql_db:
    image: postgres@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20
    container_name: postgres_db
    restart: always
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/18/data

  rabbit_mq:
    image: rabbitmq@sha256:0753b75ce99094c385483d89449d532a0544fb85e4942a478b21cc497ab66d33
    container_name: rabbit_mq
    restart: always
    ports:
      - "${RABBIT_PORT}:15672" # Do not change order of ports, it is important
      - "${AMQP_PORT}:5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
      
  redis:
    image: redis@sha256:2838d5524559494f6f1cd66e97e76b200d64a633a8614200620755ed395daf32
    container_name: redis_cache
    restart: always
    ports:
      - "${REDIS_PORT}:6379"

    


volumes:
  postgres_data:
