[project]
name = "delivery_service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "api_gateway",
  "httpx2>=2.7.0",
  "mq_consumer",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "testing-postgresql>=1.3.0",
]

[tool.uv.workspace]
members = [
    "packages/shared",
    "src/api_gateway",
    "src/mq_consumer",
]

[tool.uv.sources]
api_gateway = {workspace = true, editable = true}
mq_consumer = {workspace = true, editable = true}

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
  "src/api_gateway/src",
  "src/mq_consumer/src",
  "packages/shared/src"
]
testpaths = ["tests"]
