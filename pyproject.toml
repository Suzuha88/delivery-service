[project]
name = "delivery-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10.0.1",
    "aiohttp>=3.14.1",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.139.2",
    "loguru>=0.7.3",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "redis>=8.0.1",
    "sqlalchemy>=2.0.51",
    "tenacity>=9.1.4",
    "typer>=0.27.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "aioresponses>=0.7.8",
    "httpx>=0.28.1",
    "pytest-asyncio>=0.25.3",
    "testing.postgresql>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require external services (PostgreSQL, RabbitMQ, Redis)",
]
