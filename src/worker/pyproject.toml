[project]
name = "worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.139.0",
    "psycopg2>=2.9.12",
    "sqlalchemy>=2.0.51",
    "shared",
]

[tool.setuptools]
packages = ["db", "models", "alembic"]

[tool.uv.sources]
shared = { workspace = true }

[tool.uv]
package = true

[project.scripts]
worker = "worker.main:main"
